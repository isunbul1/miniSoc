[project]
name = "minisoc-backend"
version = "1.0.0"
description = "MiniSOC - Cybersecurity Monitoring and Threat Detection Platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
